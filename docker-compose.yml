services:
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /models
    command: >
      --model Qwen/Qwen3-4B-Instruct-2507
      --port 11435
      --host 0.0.0.0
      --max-model-len 8192
      --quantization fp8
      --gpu-memory-utilization 0.55
      --trust-remote-code
    ports:
      - "11435:11435"
    volumes:
      - hf_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      HF_TOKEN: ${HF_TOKEN}
      LD_LIBRARY_PATH: /usr/local/cuda/compat
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/models
    depends_on:
      - vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  hf_cache:
